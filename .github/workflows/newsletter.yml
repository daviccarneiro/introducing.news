name: Newsletter

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug da edição (nome do arquivo .mdx, sem extensão)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Send broadcast
        run: node scripts/send-newsletter.mjs "${{ inputs.slug }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          SITE_URL: https://introducing.news
