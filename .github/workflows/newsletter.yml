name: Newsletter

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug da edição (nome do arquivo .mdx, sem extensão)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Send broadcast
        run: node scripts/send-newsletter.mjs "$SLUG"
        env:
          SLUG: ${{ inputs.slug }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          SITE_URL: https://introducing.news
