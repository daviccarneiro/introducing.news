name: Publicar batch

on:
  # O commit do Keystatic ao programar uma edição (status: scheduled) dispara a
  # triagem; se nada estiver pronto e vencido, o job de publicação nem inicia.
  # Mudanças no próprio batch também refazem a triagem (é segura: sem edição
  # vencida, nada roda).
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - '.github/workflows/publish.yml'
      - 'scripts/publish-batch.mjs'
      - 'src/lib/editorial.mjs'
  # Disparo principal da segunda: a função agendada da Netlify
  # (netlify/functions/publish-batch.mjs) às 12:01, 13:01 e 14:01. O cron do
  # GitHub atrasa horas ou nem dispara (12/10, 19/10 e 26/10/2026).
  repository_dispatch:
    types: [publish-batch]
  schedule:
    # Reservas, caso a Netlify falhe: segundas, 12:00, 12:30, 13:15 e 14:15
    # America/Sao_Paulo (UTC-3, sem horário de verão). Depois que a edição
    # sai, a triagem não acha mais nada programado e estes disparos terminam
    # sem publicar nem enviar de novo.
    - cron: '0 15 * * 1'
    - cron: '30 15 * * 1'
    - cron: '15 16 * * 1'
    - cron: '15 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-batch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.scan.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar edição programada, pronta e vencida
        id: scan
        run: echo "due=$(node scripts/publish-batch.mjs --check)" >> "$GITHUB_OUTPUT"
      - name: Nada a publicar
        if: steps.scan.outputs.due != 'yes'
        run: echo "Nenhuma edição programada, pronta e vencida — nenhuma etapa de publicação foi executada." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: check
    if: needs.check.outputs.due == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Publicar edições programadas
        run: node scripts/publish-batch.mjs
      - name: Commit e push
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          # Edições que acabaram de virar `published` (só o status muda no batch).
          slugs=$(git diff --name-only -- src/content/posts | sed -n 's#^src/content/posts/\(.*\)\.mdx$#\1#p' | tr '\n' ' ')
          echo "slugs=${slugs% }" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git commit -m "chore(content): publicar edições do batch"
          git push
          # O push na main dispara o build/deploy da Netlify (Git integration).
      - name: Aguardar a edição no ar
        # O e-mail só sai depois que a página existe: sem isso, quem clica cedo cai num 404.
        if: steps.commit.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.commit.outputs.slugs }}
        run: |
          for slug in $SLUGS; do
            url="https://introducing.news/arquivo/$slug/"
            for attempt in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$code" = "200" ]; then
                echo "✔ $url no ar."
                continue 2
              fi
              sleep 15
            done
            echo "✖ $url não ficou no ar em 15 minutos: e-mail não enviado." >&2
            exit 1
          done
      - name: Enviar a newsletter
        # Um Broadcast por edição publicada; o nome `edição-<slug>` impede envio duplicado.
        if: steps.commit.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.commit.outputs.slugs }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          SITE_URL: https://introducing.news
        run: |
          for slug in $SLUGS; do
            node scripts/send-newsletter.mjs "$slug"
          done
