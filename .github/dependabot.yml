version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      keystatic:
        patterns:
          - '@keystatic/*'
      tooling:
        patterns:
          - wrangler
          - miniflare
          - typescript
          - '@astrojs/check'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
