version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 quebra o @astrojs/check (peer: ^5 || ^6). Reavaliar quando o peer permitir.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      keystatic:
        patterns:
          - '@keystatic/*'
      tooling:
        patterns:
          - wrangler
          - miniflare
          - typescript
          - '@astrojs/check'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
