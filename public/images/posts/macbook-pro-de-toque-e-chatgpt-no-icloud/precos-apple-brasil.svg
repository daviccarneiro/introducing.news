<title id="t">Quanto custam as novidades da Apple</title>
<desc id="d">Preço inicial no Brasil: iPad mini com tela OLED, R$ 8.499; MacBook Pro de 14 polegadas com tela de toque e M5 Pro, em destaque, R$ 34.999; de 16 polegadas com M5 Pro, R$ 41.999; de 14 polegadas com M5 Max, R$ 53.999; de 16 polegadas com M5 Max, R$ 57.999.</desc>
<rect width="600" height="410" fill="#FFFFFF"/>
<text x="20" y="34" font-size="22" font-weight="600" fill="#0B0B0C">Quanto custam as novidades da Apple</text><text x="20" y="60" font-size="15" fill="#6B6B76">Preço inicial no Brasil, sem desconto</text><text x="20" y="80" font-size="15" fill="#6B6B76">Em destaque, o MacBook Pro de toque mais barato</text>
<line x1="20" y1="104" x2="20" y2="360" stroke="#C9C9D1" stroke-width="1"/>
