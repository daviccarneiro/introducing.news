<svg xmlns="http://www.w3.org/2000/svg" width="600" height="528" viewBox="0 0 600 528" role="img" aria-labelledby="t d" font-family="Geist, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Até onde você deixa a IA ir</title>
<desc id="d">Três níveis de autonomia que chegaram nesta semana. 1, lê: o ChatGPT no modo Chat responde com base nas abas abertas; confira o que está aberto. 2, age: no modo Work, ele clica, preenche formulários, envia e baixa; confira cada formulário antes de enviar. 3, segue sozinha, em destaque: o modo de tarefas do Gemini continua com a janela fechada; confira tudo que gasta dinheiro ou fala por você.</desc>
<rect width="600" height="528" fill="#FFFFFF"/>
<text x="20" y="34" font-size="22" font-weight="600" fill="#0B0B0C" text-anchor="start">Até onde você deixa a IA ir</text><text x="20" y="60" font-size="15" font-weight="400" fill="#6B6B76" text-anchor="start">Os três níveis que chegaram nesta semana, do mais</text><text x="20" y="80" font-size="15" font-weight="400" fill="#6B6B76" text-anchor="start">seguro ao que pede mais atenção</text>
