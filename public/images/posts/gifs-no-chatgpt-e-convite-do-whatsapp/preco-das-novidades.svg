<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d" font-family="Geist, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quanto custa usar as novidades da semana</title>
<desc id="d">Preço mensal do plano mínimo para cada novidade: Eventos do WhatsApp, grátis; GIFs e fotos salvas no ChatGPT, grátis; finanças pessoais no Claude, US$ 20, no plano Pro, só nos EUA; Teammates da Perplexity, em destaque, US$ 200, no plano Max.</desc>
<rect width="600" height="360" fill="#FFFFFF"/>
<text x="20" y="34" font-size="22" font-weight="600" fill="#0B0B0C">Quanto custa usar as novidades da semana</text>
<text x="20" y="60" font-size="15" fill="#6B6B76">Preço por mês do plano mínimo, em dólares</text>
<text x="20" y="80" font-size="15" fill="#6B6B76">Em destaque, o agente da Perplexity, dez vezes o Claude Pro</text>
<line x1="20" y1="104" x2="20" y2="310" stroke="#C9C9D1" stroke-width="1"/>
<text x="30" y="120" font-size="15" font-weight="500" fill="#0B0B0C">Eventos do WhatsApp<tspan dx="8" font-size="13" font-weight="400" fill="#6B6B76">qualquer conta</tspan></text>
<circle cx="27" cy="134" r="6" fill="#9A9AA4" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="139" font-size="15" font-weight="600" fill="#0B0B0C">grátis</text>
<text x="30" y="172" font-size="15" font-weight="500" fill="#0B0B0C">GIFs e fotos salvas no ChatGPT<tspan dx="8" font-size="13" font-weight="400" fill="#6B6B76">todos os planos</tspan></text>
<circle cx="27" cy="186" r="6" fill="#9A9AA4" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="191" font-size="15" font-weight="600" fill="#0B0B0C">grátis</text>
<text x="30" y="224" font-size="15" font-weight="500" fill="#0B0B0C">Finanças pessoais no Claude<tspan dx="8" font-size="13" font-weight="400" fill="#6B6B76">Pro, só nos EUA</tspan></text>
