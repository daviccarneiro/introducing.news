<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="t d" font-family="Geist, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Como um modelo de chat e o Jev respondem à mesma tarefa</title>
<desc id="d">Diagrama em duas partes. No modelo de chat, a pergunta “este e-mail é uma reclamação?” gera um parágrafo de texto livre. No Jev, o mesmo e-mail e as opções reclamação, dúvida e elogio geram apenas a probabilidade de cada opção: 91% reclamação, 7% dúvida e 2% elogio.</desc>
<rect width="600" height="470" fill="#FFFFFF"/>
<text x="20" y="34" font-size="18" font-weight="600" fill="#0B0B0C" text-anchor="start">Modelo de chat</text><text x="20" y="56" font-size="14" font-weight="400" fill="#6B6B76" text-anchor="start">ChatGPT, Claude, Gemini: recebe uma pergunta e escreve</text><rect x="20" y="74" width="162" height="112" rx="10" fill="#F9F9FB" stroke="#E4E4E9" stroke-width="1"/><text x="34" y="102" font-size="15" font-weight="400" fill="#0B0B0C" text-anchor="start">“Este e-mail é</text><text x="34" y="123" font-size="15" font-weight="400" fill="#0B0B0C" text-anchor="start">uma reclamação?”</text><text x="34" y="166" font-size="12" font-weight="400" fill="#6B6B76" text-anchor="start">pergunta aberta</text><line x1="190" y1="130" x2="218" y2="130" stroke="#9A9AA4" stroke-width="2" stroke-linecap="round"/><path d="M216 125 L224 130 L216 135" fill="none" stroke="#9A9AA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="74" width="352" height="112" rx="10" fill="#FFFFFF" stroke="#E4E4E9" stroke-width="1"/><text x="242" y="102" font-size="15" font-weight="400" fill="#33333A" text-anchor="start">“Sim, ao que tudo indica o cliente está</text><text x="242" y="123" font-size="15" font-weight="400" fill="#33333A" text-anchor="start">insatisfeito com o atraso na entrega e</text><text x="242" y="144" font-size="15" font-weight="400" fill="#33333A" text-anchor="start">pede reembolso. Recomendo responder…”</text><text x="242" y="172" font-size="12" font-weight="400" fill="#6B6B76" text-anchor="start">texto livre: lento, caro e pode inventar</text><line x1="20" y1="218" x2="580" y2="218" stroke="#E4E4E9" stroke-width="1"/><text x="20" y="256" font-size="18" font-weight="600" fill="#0B0B0C" text-anchor="start">Jev, modelo de decisão</text><text x="20" y="278" font-size="14" font-weight="400" fill="#6B6B76" text-anchor="start">Recebe o texto e as opções possíveis; devolve só a escolha</text><rect x="20" y="296" width="162" height="140" rx="10" fill="#F9F9FB" stroke="#E4E4E9" stroke-width="1"/><text x="34" y="324" font-size="15" font-weight="400" fill="#0B0B0C" text-anchor="start">O e-mail +</text><text x="34" y="345" font-size="15" font-weight="400" fill="#0B0B0C" text-anchor="start">as opções:</text><text x="34" y="372" font-size="14" font-weight="400" fill="#33333A" text-anchor="start">reclamação</text><text x="34" y="393" font-size="14" font-weight="400" fill="#33333A" text-anchor="start">dúvida</text><text x="34" y="414" font-size="14" font-weight="400" fill="#33333A" text-anchor="start">elogio</text><line x1="190" y1="366" x2="218" y2="366" stroke="#9A9AA4" stroke-width="2" stroke-linecap="round"/><path d="M216 361 L224 366 L216 371" fill="none" stroke="#9A9AA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="296" width="352" height="140" rx="10" fill="#FFFFFF" stroke="#E4E4E9" stroke-width="1"/><text x="242" y="331" font-size="15" font-weight="600" fill="#0B0B0C" text-anchor="start">reclamação</text><rect x="350" y="320" width="160" height="10" rx="4" fill="#F2F2F5"/><rect x="350" y="320" width="145.6" height="10" rx="4" fill="#F6821F"/><text x="566" y="331" font-size="15" font-weight="600" fill="#0B0B0C" text-anchor="end">91%</text><text x="242" y="361" font-size="15" font-weight="400" fill="#33333A" text-anchor="start">dúvida</text><rect x="350" y="350" width="160" height="10" rx="4" fill="#F2F2F5"/><rect x="350" y="350" width="11.2" height="10" rx="4" fill="#9A9AA4"/><text x="566" y="361" font-size="15" font-weight="400" fill="#0B0B0C" text-anchor="end">7%</text><text x="242" y="391" font-size="15" font-weight="400" fill="#33333A" text-anchor="start">elogio</text><rect x="350" y="380" width="160" height="10" rx="4" fill="#F2F2F5"/><rect x="350" y="380" width="3.2" height="10" rx="4" fill="#9A9AA4"/><text x="566" y="391" font-size="15" font-weight="400" fill="#0B0B0C" text-anchor="end">2%</text><text x="242" y="422" font-size="12" font-weight="400" fill="#6B6B76" text-anchor="start">só escolhe, com a confiança de cada opção</text><text x="20" y="458" font-size="12" font-weight="400" fill="#9A9AA4" text-anchor="start">Ilustração: introducing.news, com base na documentação do Jev (TypeSafe AI)</text>
</svg>
