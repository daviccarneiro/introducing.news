<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="t d" font-family="Geist, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Inteligência versus custo por tarefa dos modelos de IA</title>
<desc id="d">Gráfico de dispersão. Os modelos mais bem avaliados, como Claude Opus 5.5 (58 pontos, US$ 5,98 por tarefa), ficam no alto e à direita. Claude Haiku 5.5 (43 pontos, US$ 0,21) e DeepSeek V4.1 Flash (39 pontos, US$ 0,27, destacado em laranja) ficam à esquerda, entre os mais baratos.</desc>
<rect width="600" height="540" fill="#FFFFFF"/>
