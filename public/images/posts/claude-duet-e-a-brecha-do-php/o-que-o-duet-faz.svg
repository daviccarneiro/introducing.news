<svg xmlns="http://www.w3.org/2000/svg" width="600" height="528" viewBox="0 0 600 528" role="img" aria-labelledby="t d" font-family="Geist, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">O que o Claude Duet faz por você</title>
<desc id="d">Três níveis do que o Claude Duet faz. Faz sozinho: confere e-mail e agenda a cada poucas horas, manda o resumo da manhã e prepara rascunhos. Pede sua aprovação, em destaque: antes de enviar mensagem, pagar, assinar documento ou apagar algo. Não faz nem com aprovação: negociar ações ou transferir dinheiro entre contas.</desc>
<rect width="600" height="528" fill="#FFFFFF"/>
<text x="20" y="34" font-size="22" font-weight="600" fill="#0B0B0C">O que o Claude Duet faz por você</text><text x="20" y="60" font-size="15" fill="#6B6B76">As regras do agente proativo da Anthropic, do que</text><text x="20" y="80" font-size="15" fill="#6B6B76">ele faz sozinho ao que fica de fora</text>
<rect x="20" y="104" width="560" height="112" rx="12" fill="#F9F9FB" stroke="#E4E4E9"/><rect x="20" y="104" width="6" height="112" rx="3" fill="#9A9AA4"/><text x="44" y="134" font-size="19" font-weight="600" fill="#0B0B0C">1. Faz sozinho</text><text x="44" y="156" font-size="14" font-weight="500" fill="#6B6B76">Sem pedir licença</text><text x="44" y="180" font-size="15" fill="#0B0B0C">Confere e-mail e agenda a cada poucas horas,</text><text x="44" y="202" font-size="15" fill="#0B0B0C">manda o resumo da manhã e prepara rascunhos.</text>
<path d="M300 219 V229" stroke="#C9C9D1" stroke-width="2"/><path d="M295 225 L300 231 L305 225" fill="none" stroke="#C9C9D1" stroke-width="2"/>
<rect x="20" y="234" width="560" height="112" rx="12" fill="#F9F9FB" stroke="#E4E4E9"/><rect x="20" y="234" width="6" height="112" rx="3" fill="#F6821F"/><text x="44" y="264" font-size="19" font-weight="600" fill="#0B0B0C">2. Pede sua aprovação</text><text x="44" y="286" font-size="14" font-weight="500" fill="#6B6B76">Mostra o que vai fazer e espera você</text><text x="44" y="310" font-size="15" fill="#0B0B0C">Enviar mensagem, pagar, assinar documento</text><text x="44" y="332" font-size="15" fill="#0B0B0C">ou apagar qualquer coisa.</text>
<path d="M300 349 V359" stroke="#C9C9D1" stroke-width="2"/><path d="M295 355 L300 361 L305 355" fill="none" stroke="#C9C9D1" stroke-width="2"/>
<rect x="20" y="364" width="560" height="112" rx="12" fill="#F9F9FB" stroke="#E4E4E9"/><rect x="20" y="364" width="6" height="112" rx="3" fill="#6B6B76"/><text x="44" y="394" font-size="19" font-weight="600" fill="#0B0B0C">3. Não faz nem com aprovação</text><text x="44" y="416" font-size="14" font-weight="500" fill="#6B6B76">Fora do alcance no teste</text><text x="44" y="440" font-size="15" fill="#0B0B0C">Negociar ações ou transferir dinheiro</text><text x="44" y="462" font-size="15" fill="#0B0B0C">entre contas.</text>
<text x="20" y="508" font-size="13" fill="#9A9AA4">Fonte: Anthropic · consulta em 25/out/2026</text>
</svg>
