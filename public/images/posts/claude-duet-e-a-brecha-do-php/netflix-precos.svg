<svg xmlns="http://www.w3.org/2000/svg" width="600" height="432" viewBox="0 0 600 432" role="img" aria-labelledby="t d" font-family="Geist, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quanto ficou a Netflix no Brasil</title>
<desc id="d">Preço mensal antes e depois do reajuste de 15 de outubro de 2026: Padrão com anúncios, em destaque, de R$ 20,90 para R$ 25,90, alta de 23,9%; Padrão, de R$ 44,90 para R$ 51,90, alta de 15,6%; Premium, de R$ 59,90 para R$ 71,90, alta de 20%.</desc>
<rect width="600" height="432" fill="#FFFFFF"/>
<text x="20" y="34" font-size="22" font-weight="600" fill="#0B0B0C">Quanto ficou a Netflix no Brasil</text><text x="20" y="60" font-size="15" fill="#6B6B76">Preço por mês antes e depois do reajuste de 15/out</text><text x="20" y="80" font-size="15" fill="#6B6B76">O plano mais barato teve a maior alta em porcentagem</text>
<line x1="20" y1="104" x2="20" y2="378" stroke="#C9C9D1" stroke-width="1"/>
